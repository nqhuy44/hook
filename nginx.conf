worker_processes 1;

events {
    worker_connections 1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    keepalive_timeout  65;

    server {
        listen       80;
        server_name  localhost;

        # Root directory for Godot HTML5 export
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
            
            # Coping with SharedArrayBuffer requirements (Godot 4 Multi-threaded)
            # If standard export, might not need headers, but good for safety
            add_header Cross-Origin-Opener-Policy "same-origin";
            add_header Cross-Origin-Embedder-Policy "require-corp";
        }

        # WebSocket Proxy to Go Backend
        location /ws {
            proxy_pass http://host.docker.internal:8080/ws;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
        }
    }
}
