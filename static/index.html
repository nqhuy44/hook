<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HooK</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>

    <div id="ui-layer">
        <!-- MENU -->
        <div id="menu-screen" class="screen">
            <h1 class="glitch">HooK</h1>
            <div class="auth-box">
                <input type="text" id="pname" placeholder="ENTER HERO NAME" maxlength="12">
                
                <button onclick="createRoom()">CREATE LOBBY</button>
                <div class="join-row" style="width:100%">
                    <input type="text" id="room-code" placeholder="CODE" maxlength="6">
                    <button class="secondary" onclick="joinRoom()">JOIN</button>
                </div>
            </div>
        </div>

        <!-- LOBBY -->
        <div id="lobby-screen" class="screen hidden">
            <h1 id="lobby-title" style="font-size: 4rem;">LOBBY</h1>
            <div id="room-code-display" style="font-size: 2rem; color: gold; margin-bottom: 20px;">CODE: ??????</div>
            
            <div style="margin-bottom: 20px;">
                <div style="color:#aaa; font-size: 1rem; margin-bottom: 10px; text-align:center;">SELECT MODEL</div>
                <div id="lobby-model-selector" style="display:flex; gap:10px; flex-wrap:wrap; justify-content:center; max-width: 600px;"></div>
            </div>

            <div class="lobby-content">
                <div class="team-panel radiant">
                    <div style="font-size: 1.5rem; color:#00e676; margin-bottom: 10px; text-align: center;">RADIANT</div>
                    <div id="list-1"></div>
                </div>
                <div class="team-panel dire">
                    <div style="font-size: 1.5rem; color:#ff1744; margin-bottom: 10px; text-align: center;">DIRE</div>
                    <div id="list-2"></div>
                </div>
            </div>

            <div style="display:flex; gap: 20px;">
                <button class="secondary" onclick="switchTeam()">SWITCH TEAM</button>
                <button id="start-btn" onclick="startGame()" class="hidden">START MATCH</button>
            </div>
        </div>

        <!-- HUD -->
        <div id="hud-container" class="hidden">
            <div id="scoreboard">
                <span class="radiant" id="sc-1">0</span>
                <span class="timer" id="timer-display">5:00</span>
                <span class="dire" id="sc-2">0</span>
            </div>

            <div id="kill-feed"></div>
            
            <div id="hud-bottom">
                <div class="main-panel">
                    <div class="hero-portrait" id="hud-portrait"></div>
                    <div class="stats-col">
                        <div id="hero-name" style="color:#fff; font-weight:bold; font-size: 1.2rem;">HERO</div>
                        <div class="bar-wrap"><div class="bar-fill hp-fill" id="hp-bar" style="width:100%"></div><div class="bar-text" id="hp-text">1000 / 1000</div></div>
                        <div class="bar-wrap"><div class="bar-fill mp-fill" id="mp-bar" style="width:100%"></div><div class="bar-text" id="mp-text">500 / 500</div></div>
                    </div>
                    <div class="skills-row" id="skills"></div>
                </div>
            </div>

            <div id="game-over-screen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index: 200; flex-direction: column; align-items: center; justify-content: center; pointer-events: auto;">
                <h1 id="winner-text" style="font-size: 8rem;">RADIANT VICTORY</h1>
                <button onclick="location.reload()" style="font-size: 2rem; padding: 20px 50px;">RETURN TO BASE</button>
            </div>
             <div id="dead-screen" style="display:none; position:absolute; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index: 150; flex-direction: column; align-items: center; justify-content: center; color: #d50000; font-size: 5rem; text-shadow: 0 0 20px red;">YOU DIED</div>
             <div id="wrong-side" style="display:none; position:absolute; top:150px; left:50%; transform:translateX(-50%); color:red; font-size:3rem; font-weight:bold; animation: pulse 0.5s infinite;">WRONG SIDE!</div>
        </div>
    </div>
    
    <canvas id="gameCanvas" class="hidden"></canvas>
    <script src="/static/game.js"></script>
</body>
</html>
