<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HooK Lobby</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Kurzgesagt Dark Palette */
        --bg-deep: #1e1e24;
        --bg-panel: #2b2b36;
        --bg-card: #202028;

        --accent-cyan: #90caf9;
        --accent-yellow: #fdd835;
        --accent-red: #ef5350;
        --accent-green: #66bb6a;

        --text-main: #ffffff;
        --text-muted: #8a8a9b;

        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-round: 50%;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden; /* Prevent body scroll */
        display: flex;
        justify-content: center;
        align-items: center;
        background-image: radial-gradient(#3a3a45 1px, transparent 1px);
        background-size: 20px 20px;
      }

      .app-container {
        width: 95%;
        height: 95%; /* Tăng chiều cao vùng chứa để thoải mái hơn */
        max-width: 1500px;
        display: grid;
        grid-template-rows: auto 1fr;
        gap: 15px; /* Giảm gap chút */
      }

      /* --- HEADER --- */
      .header {
        display: flex;
        align-items: center;
      }
      .room-badge {
        background-color: var(--accent-cyan);
        color: #1a2634;
        font-weight: 800;
        padding: 6px 20px;
        border-radius: 20px;
        font-size: 1rem;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.2);
        letter-spacing: 1px;
      }

      /* --- LAYOUT GRID --- */
      .lobby-grid {
        display: grid;
        grid-template-columns: 280px 1fr 300px;
        gap: 20px;
        height: 100%;
        overflow: hidden;
      }

      /* --- LEFT: PREVIEW PANEL --- */
      .preview-panel {
        background-color: var(--bg-panel);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        overflow: hidden;
        border: 3px solid rgba(0, 0, 0, 0.1);
      }

      .preview-header {
        background-color: var(--bg-card);
        padding: 20px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 10px;
        border-bottom: 3px solid rgba(0, 0, 0, 0.1);
      }

      .avatar-large {
        width: 100px; /* Resize nhỏ lại chút cho cân đối */
        height: 100px;
        border-radius: var(--radius-round);
        background-color: var(--accent-yellow);
        border: 5px solid var(--bg-panel);
        position: relative;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        transition: background-color 0.3s;
      }

      .hero-name {
        font-size: 1.2rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 1px;
        color: #fff;
      }

      .preview-body {
        flex: 1;
        background-color: var(--bg-card);
        margin-top: -3px;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
      }

      .game-model-preview {
        width: 80px;
        height: 80px;
        background-color: var(--accent-yellow);
        border-radius: 50%;
        border: 4px solid #000;
        position: relative;
        box-shadow: 0 10px 20px rgba(0, 0, 0, 0.5);
        transition: background-color 0.3s;
      }
      .game-model-hand {
        position: absolute;
        width: 24px;
        height: 24px;
        background: #000;
        border-radius: 50%;
        top: 25px;
        right: -12px;
      }
      .game-model-weapon {
        position: absolute;
        width: 12px;
        height: 12px;
        background: #555;
        top: 31px;
        right: -6px;
        border-radius: 4px;
      }

      /* --- CENTER: SELECTION & TEAMS --- */
      .center-panel {
        display: flex;
        flex-direction: column;
        gap: 15px;
        overflow: visible; /* Cho phép hiển thị hết */
      }

      /* HERO SELECTOR (GRID WRAP) */
      .hero-selector {
        background-color: var(--bg-panel);
        padding: 15px;
        border-radius: var(--radius-lg);
        display: flex;
        flex-wrap: wrap;
        gap: 8px; /* Giảm gap */
        justify-content: center;
        align-content: center;
        border: 3px solid rgba(0, 0, 0, 0.1);
        flex-shrink: 0; /* Không co lại */
      }

      .hero-option {
        width: 38px; /* Compact size */
        height: 38px;
        border-radius: 8px;
        cursor: pointer;
        transition: transform 0.1s, box-shadow 0.1s;
        border: 2px solid transparent;
        position: relative;
      }
      .hero-option:hover {
        transform: scale(1.15);
        z-index: 5;
      }
      .hero-option.selected {
        border-color: #fff;
        box-shadow: 0 0 0 3px var(--accent-cyan);
        transform: scale(1.15);
        z-index: 2;
      }

      /* 24 Unique Colors */
      .hero-01 {
        background: #fdd835;
      }
      .hero-02 {
        background: #e91e63;
      }
      .hero-03 {
        background: #9c27b0;
      }
      .hero-04 {
        background: #673ab7;
      }
      .hero-05 {
        background: #3f51b5;
      }
      .hero-06 {
        background: #2196f3;
      }
      .hero-07 {
        background: #03a9f4;
      }
      .hero-08 {
        background: #00bcd4;
      }
      .hero-09 {
        background: #009688;
      }
      .hero-10 {
        background: #4caf50;
      }
      .hero-11 {
        background: #8bc34a;
      }
      .hero-12 {
        background: #cddc39;
      }
      .hero-13 {
        background: #ffeb3b;
      }
      .hero-14 {
        background: #ffc107;
      }
      .hero-15 {
        background: #ff9800;
      }
      .hero-16 {
        background: #ff5722;
      }
      .hero-17 {
        background: #795548;
      }
      .hero-18 {
        background: #9e9e9e;
      }
      .hero-19 {
        background: #607d8b;
      }
      .hero-20 {
        background: #ffffff;
      }
      .hero-21 {
        background: #000000;
        border: 1px solid #555;
      }
      .hero-22 {
        background: linear-gradient(135deg, #ff0000, #0000ff);
      }
      .hero-23 {
        background: linear-gradient(135deg, #ffc107, #ff5722);
      }
      .hero-24 {
        background: repeating-linear-gradient(
          45deg,
          #606dbc,
          #606dbc 5px,
          #465298 5px,
          #465298 10px
        );
      }

      /* TEAMS CONTAINER */
      .teams-container {
        flex: 1; /* Tự động chiếm hết phần còn lại */
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 20px;
        /* QUAN TRỌNG: Visible để không cuộn */
        overflow: visible;
      }

      .team-box {
        background-color: rgba(0, 0, 0, 0.2);
        border-radius: var(--radius-lg);
        padding: 12px;
        display: flex;
        flex-direction: column;
        justify-content: flex-start; /* Dồn lên trên */
        gap: 6px; /* Giảm khoảng cách giữa các slot */
        border-top: 4px solid #555;
        height: 100%; /* Full height của container */
      }
      .team-green {
        border-top-color: var(--accent-green);
        background: linear-gradient(
          180deg,
          rgba(102, 187, 106, 0.05),
          transparent
        );
      }
      .team-red {
        border-top-color: var(--accent-red);
        background: linear-gradient(
          180deg,
          rgba(239, 83, 80, 0.05),
          transparent
        );
      }

      .team-title {
        font-weight: 800;
        text-transform: uppercase;
        font-size: 0.85rem;
        letter-spacing: 1px;
        margin-bottom: 5px;
        text-align: center;
      }
      .t-green-text {
        color: var(--accent-green);
      }
      .t-red-text {
        color: var(--accent-red);
      }

      .player-slot {
        background-color: var(--bg-card);
        padding: 4px 10px; /* Compact padding */
        border-radius: 8px;
        display: flex;
        align-items: center;
        gap: 10px;
        height: 40px; /* Fixed compact height */
        flex-shrink: 0;
      }
      .player-slot.empty {
        opacity: 0.3;
        border: 1px dashed #666;
        background: transparent;
      }

      .slot-avatar {
        width: 28px;
        height: 28px;
        border-radius: 50%;
        background: #444;
        border: 2px solid rgba(255, 255, 255, 0.1);
      }
      .slot-name {
        font-weight: 700;
        font-size: 0.85rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .slot-host {
        font-size: 0.6rem;
        background: #ff9800;
        color: #000;
        padding: 2px 5px;
        border-radius: 4px;
        font-weight: bold;
        margin-left: auto;
      }

      /* --- RIGHT: CHAT --- */
      .chat-panel {
        background-color: var(--bg-panel);
        border-radius: var(--radius-lg);
        display: flex;
        flex-direction: column;
        border: 3px solid rgba(0, 0, 0, 0.1);
      }
      .chat-header {
        padding: 15px;
        font-weight: 800;
        border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        font-size: 0.9rem;
      }
      .chat-area {
        flex: 1;
        padding: 15px;
        font-size: 0.9rem;
        color: #ccc;
        overflow-y: auto;
      }
      .chat-input-area {
        padding: 15px;
        border-top: 1px solid rgba(255, 255, 255, 0.1);
        display: flex;
        gap: 10px;
      }
      .c-input {
        flex: 1;
        background: rgba(0, 0, 0, 0.3);
        border: none;
        padding: 10px 15px;
        border-radius: 8px;
        color: white;
        outline: none;
      }

      /* --- ACTION BAR --- */
      .action-bar {
        grid-column: 1 / -1;
        display: flex;
        justify-content: flex-end;
        pointer-events: none;
        margin: 12px 0 12px 0;
      }
      .btn {
        pointer-events: auto;
        border: none;
        padding: 12px 32px;
        margin-left: 15px;
        border-radius: 30px;
        font-weight: 800;
        font-size: 1rem;
        text-transform: uppercase;
        cursor: pointer;
        box-shadow: 0 4px 0 rgba(0, 0, 0, 0.3);
        transition: transform 0.1s;
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.3);
      }
      .btn-switch {
        background: #fff;
        color: #222;
      }
      .btn-start {
        background: var(--accent-green);
        color: #1a331a;
        min-width: 180px;
      }
    </style>
  </head>
  <body>
    <div class="app-container">
      <div class="header">
        <div class="room-badge">ROOM: 006932</div>
      </div>

      <div class="lobby-grid">
        <div class="preview-panel">
          <div class="preview-header">
            <div class="avatar-large hero-01">
              <span>👀</span>
            </div>
            <div class="hero-name">PSYDUCK</div>
          </div>
          <div class="preview-body">
            <div class="game-model-preview hero-01">
              <div class="game-model-hand"></div>
              <div class="game-model-weapon"></div>
            </div>
          </div>
        </div>

        <div class="center-panel">
          <div class="hero-selector">
            <div class="hero-option hero-01 selected"></div>
            <div class="hero-option hero-02"></div>
            <div class="hero-option hero-03"></div>
            <div class="hero-option hero-04"></div>
            <div class="hero-option hero-05"></div>
            <div class="hero-option hero-06"></div>
            <div class="hero-option hero-07"></div>
            <div class="hero-option hero-08"></div>
            <div class="hero-option hero-09"></div>
            <div class="hero-option hero-10"></div>
            <div class="hero-option hero-11"></div>
            <div class="hero-option hero-12"></div>
            <div class="hero-option hero-13"></div>
            <div class="hero-option hero-14"></div>
            <div class="hero-option hero-15"></div>
            <div class="hero-option hero-16"></div>
            <div class="hero-option hero-17"></div>
            <div class="hero-option hero-18"></div>
            <div class="hero-option hero-19"></div>
            <div class="hero-option hero-20"></div>
            <div class="hero-option hero-21"></div>
            <div class="hero-option hero-22"></div>
            <div class="hero-option hero-23"></div>
            <div class="hero-option hero-24"></div>
          </div>

          <div class="teams-container">
            <div class="team-box team-green">
              <div class="team-title t-green-text">Green (1/7)</div>

              <div class="player-slot">
                <div class="slot-avatar hero-01"></div>
                <div class="slot-name">Psyduck</div>
                <div class="slot-host">HOST</div>
              </div>

              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
            </div>

            <div class="team-box team-red">
              <div class="team-title t-red-text">Red (0/7)</div>

              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
              <div class="player-slot empty">
                <div class="slot-name">Empty Slot</div>
              </div>
            </div>
          </div>
        </div>

        <div class="chat-panel">
          <div class="chat-header">COMMS LINK</div>
          <div class="chat-area">
            <div style="color: #666; font-size: 0.8rem; margin-bottom: 10px">
              Welcome to the lobby!
            </div>
            <div>
              <b style="color: var(--accent-yellow)">Psyduck:</b> GOGOGO!
            </div>
          </div>
          <div class="chat-input-area">
            <input type="text" class="c-input" placeholder="Type..." />
          </div>
        </div>

        <div class="action-bar">
          <button class="btn btn-switch">Switch Team</button>
          <button class="btn btn-start">START GAME</button>
        </div>
      </div>
    </div>
  </body>
</html>
