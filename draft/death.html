<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HooK - Respawn</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Kurzgesagt Palette */
        --bg-overlay: rgba(30, 30, 36, 0.85); /* Nền tối mờ */
        --bg-panel: #2b2b36;

        --accent-yellow: #fdd835;
        --accent-red: #ef5350;
        --accent-cyan: #4fc3f7;
        --text-main: #ffffff;
        --text-muted: #8a8a9b;

        --radius-xl: 24px;
        --radius-round: 50%;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        font-family: "Nunito", sans-serif;
        background: url("image_5e3823.jpg") no-repeat center center/cover; /* Giả lập nền game */
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* --- DEATH SCREEN OVERLAY --- */
      .death-overlay {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background-color: var(--bg-overlay);
        backdrop-filter: blur(8px); /* Làm mờ game phía sau */
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 100;
        animation: fadeIn 0.3s ease-out;
      }

      @keyframes fadeIn {
        from {
          opacity: 0;
        }
        to {
          opacity: 1;
        }
      }

      /* 1. TITLE */
      .death-title {
        font-size: 4rem;
        font-weight: 900;
        color: var(--accent-red);
        text-transform: uppercase;
        letter-spacing: 5px;
        margin-bottom: 30px;
        text-shadow: 4px 4px 0 rgba(0, 0, 0, 0.5);
        animation: dropDown 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      }
      @keyframes dropDown {
        from {
          transform: translateY(-50px);
          opacity: 0;
        }
        to {
          transform: translateY(0);
          opacity: 1;
        }
      }

      /* 2. KILLER INFO CARD */
      .killer-card {
        background-color: var(--bg-panel);
        padding: 20px 40px;
        border-radius: var(--radius-xl);
        border: 4px solid rgba(255, 255, 255, 0.1);
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
        margin-bottom: 40px;
        box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        position: relative;
      }

      .killer-label {
        font-size: 0.9rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
      }

      .killer-avatar-wrapper {
        position: relative;
      }

      .killer-avatar {
        width: 100px;
        height: 100px;
        background: #eee; /* White/Dire color */
        border-radius: 50%;
        border: 4px solid var(--accent-red);
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 3rem;
        box-shadow: 0 5px 15px rgba(239, 83, 80, 0.4);
      }

      .killer-name {
        font-size: 1.8rem;
        font-weight: 900;
        color: white;
      }

      /* Weapon Icon (Overlay on avatar) */
      .kill-weapon {
        position: absolute;
        bottom: -5px;
        right: -5px;
        width: 36px;
        height: 36px;
        background: #333;
        border: 2px solid white;
        border-radius: 50%;
        display: flex;
        justify-content: center;
        align-items: center;
        font-size: 1.2rem;
      }

      /* 3. RESPAWN TIMER (Animated Ring) */
      .respawn-container {
        position: relative;
        width: 120px;
        height: 120px;
        display: flex;
        justify-content: center;
        align-items: center;
      }

      /* SVG Ring */
      .progress-ring__circle {
        transition: stroke-dashoffset 0.35s;
        transform: rotate(-90deg);
        transform-origin: 50% 50%;
        stroke: var(--accent-yellow);
      }

      .timer-text {
        position: absolute;
        font-size: 2.5rem;
        font-weight: 900;
        color: white;
      }
      .timer-label {
        position: absolute;
        bottom: -30px;
        font-size: 0.9rem;
        font-weight: 700;
        color: var(--text-muted);
        text-transform: uppercase;
      }

      /* 4. TIP TEXT */
      .tip-text {
        margin-top: 50px;
        font-size: 1rem;
        color: rgba(255, 255, 255, 0.6);
        font-style: italic;
        background: rgba(0, 0, 0, 0.3);
        padding: 8px 20px;
        border-radius: 20px;
      }
    </style>
  </head>
  <body>
    <div class="death-overlay">
      <div class="death-title">Eliminated</div>

      <div class="killer-card">
        <div class="killer-label">Eliminated By</div>

        <div class="killer-avatar-wrapper">
          <div class="killer-avatar">😈</div>
          <div class="kill-weapon">⚓</div>
        </div>

        <div class="killer-name">Bot 1002</div>
      </div>

      <div class="respawn-container">
        <svg class="progress-ring" width="120" height="120">
          <circle
            class="progress-ring__bg"
            stroke="rgba(255,255,255,0.1)"
            stroke-width="8"
            fill="transparent"
            r="52"
            cx="60"
            cy="60"
          />
          <circle class="progress-ring__circle" stroke-width="8"
          stroke-linecap="round" fill="transparent" r="52" cx="60" cy="60"
          style="stroke-dasharray: 326; stroke-dashoffset: 50;" /* Demo offset
          */ />
        </svg>
        <div class="timer-text">4</div>
        <div class="timer-label">Respawning</div>
      </div>

      <div class="tip-text">Tip: Don't stand near the river edge!</div>
    </div>
  </body>
</html>
