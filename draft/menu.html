<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HooK - Main Menu</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        /* Kurzgesagt Dark Palette */
        --bg-deep: #1e1e24;
        --bg-panel: #2b2b36;
        --bg-input: rgba(0, 0, 0, 0.3);

        --accent-yellow: #fdd835;
        --accent-cyan: #90caf9;
        --accent-red: #ef5350;
        --accent-green: #66bb6a;
        --accent-purple: #ab47bc;

        --text-main: #ffffff;
        --text-muted: #8a8a9b;

        --radius-xl: 24px;
        --radius-lg: 16px;
        --radius-md: 12px;
        --radius-pill: 50px;
      }

      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
      }

      body {
        font-family: "Nunito", sans-serif;
        background-color: var(--bg-deep);
        color: var(--text-main);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        background-image: radial-gradient(#3a3a45 1px, transparent 1px);
        background-size: 30px 30px;
      }

      /* --- DECORATIONS --- */
      .planet {
        position: absolute;
        border-radius: 50%;
        opacity: 0.9;
        z-index: 0;
        box-shadow: inset -10px -10px 0 rgba(0, 0, 0, 0.1);
        animation: float 6s ease-in-out infinite;
      }
      .planet-1 {
        width: 120px;
        height: 120px;
        background: var(--accent-red);
        top: 15%;
        left: 10%;
        animation-delay: 0s;
      }
      .planet-2 {
        width: 80px;
        height: 80px;
        background: var(--accent-cyan);
        bottom: 15%;
        right: 10%;
        animation-delay: 2s;
      }
      .planet-3 {
        width: 40px;
        height: 40px;
        background: var(--accent-purple);
        top: 20%;
        right: 25%;
        animation-delay: 4s;
      }

      @keyframes float {
        0%,
        100% {
          transform: translateY(0);
        }
        50% {
          transform: translateY(-20px);
        }
      }

      /* --- MAIN LAYOUT --- */
      .menu-container {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        align-items: center;
        width: 100%;
        max-width: 400px; /* Giới hạn chiều rộng nhỏ hơn chút cho gọn */

        /* Optical Centering: Dịch lên chút để cân đối với mắt */
        transform: translateY(-20px);
      }

      /* LOGO */
      .logo {
        font-size: 5.5rem; /* Giảm nhẹ size */
        font-weight: 900;
        color: var(--accent-yellow);
        text-transform: uppercase;
        letter-spacing: 5px;
        text-shadow: 4px 4px 0 #000, -2px -2px 0 #000, 2px -2px 0 #000,
          -2px 2px 0 #000, 4px 4px 0 #000;
        position: relative;
        margin-bottom: -15px; /* Kéo gần lại với Panel */
        z-index: 20; /* Đè lên panel một chút nếu cần */
      }
      /* .logo::after {
        content: "⚓";
        font-size: 2.5rem;
        position: absolute;
        right: -25px;
        bottom: 20px;
        transform: rotate(-15deg);
        filter: drop-shadow(2px 2px 0 #000);
      } */

      /* PANEL */
      .menu-panel {
        background-color: var(--bg-panel);
        width: 100%;
        padding: 40px 30px;
        border-radius: var(--radius-xl);
        border: 4px solid rgba(0, 0, 0, 0.2);
        box-shadow: 0 15px 40px rgba(0, 0, 0, 0.6);
        display: flex;
        flex-direction: column;
        gap: 18px;
        position: relative;
      }

      .input-group {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }

      .label {
        font-size: 0.8rem;
        font-weight: 800;
        color: var(--text-muted);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-left: 8px;
      }

      .input-field {
        width: 100%;
        padding: 14px 20px;
        font-size: 1.1rem;
        font-weight: 700;
        font-family: inherit;
        color: white;
        background-color: var(--bg-input);
        border: 2px solid transparent;
        border-radius: var(--radius-lg);
        outline: none;
        text-align: center;
        transition: all 0.2s;
      }
      .input-field:focus {
        background-color: rgba(255, 255, 255, 0.05);
        border-color: var(--accent-cyan);
        box-shadow: 0 0 0 4px rgba(144, 202, 249, 0.15);
      }

      /* BUTTONS */
      .btn-group {
        display: flex;
        flex-direction: column;
        gap: 12px;
        margin-top: 5px;
      }

      .btn {
        width: 100%;
        padding: 15px;
        font-size: 1rem;
        font-weight: 900;
        text-transform: uppercase;
        border: none;
        border-radius: var(--radius-pill);
        cursor: pointer;
        transition: transform 0.1s;
        box-shadow: 0 5px 0 rgba(0, 0, 0, 0.3);
      }
      .btn:active {
        transform: translateY(3px);
        box-shadow: 0 2px 0 rgba(0, 0, 0, 0.3);
      }

      .btn-primary {
        background-color: var(--accent-yellow);
        color: #3e2723;
      }
      .btn-secondary {
        background-color: #fff;
        color: #2c3e50;
      }

      /* FOOTER / SETTINGS BUTTON (ANCHOR) */
      .menu-footer {
        margin-top: 25px;
        display: flex;
        justify-content: center;
        gap: 15px;
      }
      .btn-icon {
        background: rgba(255, 255, 255, 0.05);
        border: 2px solid rgba(255, 255, 255, 0.1);
        color: var(--text-muted);
        width: 45px;
        height: 45px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 1.2rem;
        cursor: pointer;
        transition: all 0.2s;
      }
      .btn-icon:hover {
        background: rgba(255, 255, 255, 0.1);
        color: white;
        border-color: rgba(255, 255, 255, 0.3);
      }

      /* Divider */
      .divider {
        text-align: center;
        color: rgba(255, 255, 255, 0.2);
        font-size: 0.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 5px 0;
      }
      .divider::before,
      .divider::after {
        content: "";
        flex: 1;
        height: 2px;
        background: rgba(255, 255, 255, 0.1);
        border-radius: 2px;
      }
    </style>
  </head>
  <body>
    <div class="planet planet-1"></div>
    <div class="planet planet-2"></div>
    <div class="planet planet-3"></div>

    <div class="menu-container">
      <div class="logo">HooK</div>

      <div class="menu-panel">
        <div class="input-group">
          <div class="label">Codename</div>
          <input
            type="text"
            class="input-field"
            placeholder="Enter name..."
            value="Psyduck"
          />
        </div>

        <div class="divider">GAME ROOM</div>

        <div class="input-group">
          <div class="label">Room Code</div>
          <input
            type="text"
            class="input-field"
            placeholder="######"
            style="letter-spacing: 2px; font-family: monospace"
          />
        </div>

        <div class="btn-group">
          <button class="btn btn-secondary">Join Room</button>
          <button class="btn btn-primary">Create Room</button>
        </div>
      </div>

      <!-- <div class="menu-footer">
        <div class="btn-icon" title="Settings">⚙️</div>
        <div class="btn-icon" title="About">?</div>
        <div class="btn-icon" title="GitHub">🐙</div>
      </div> -->
    </div>
  </body>
</html>
